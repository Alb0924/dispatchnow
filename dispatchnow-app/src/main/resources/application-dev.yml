spring:
  config:
    # 从项目根目录启动时，与 Compose 共用同一份本地变量。
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:project01}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=3000
    username: ${MYSQL_USER:dispatchnow}
    password: ${MYSQL_PASSWORD:dispatchnow_local}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dispatchnow_redis_local}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:dispatchnow}
    password: ${RABBITMQ_PASSWORD:dispatchnow_rabbit_local}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:dispatchnow}

management:
  endpoint:
    health:
      group:
        readiness:
          show-components: always
        infrastructure:
          include: db,redis,rabbit
          show-components: always

logging:
  level:
    com.dispatchnow: DEBUG
